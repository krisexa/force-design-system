name: check

# Every push and pull request: the token invariants, then the same build
# Cloudflare Pages runs (this version plus every tagged release). A failure
# here is what stops a bad token from reaching every site that links /v1/, and
# what stops a tagged version from being republished with different bytes.
#
# On main, a new `version` in package.json is then tagged `v<version>`. The
# tag is what the Pages build republishes and what the bundler sites depend on.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Invariants
        run: npm run check
      - name: Build (this version + tagged releases)
        run: node scripts/build.mjs --releases
      - name: Report
        run: |
          echo "## Build" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node -e "const m=require('./dist/manifest.json');console.log('version',m.version);console.log('channels',Object.keys(m.channels).join(', '));console.log('fonts',Object.keys(m.fonts).length)" >> "$GITHUB_STEP_SUMMARY"
          du -sh dist >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag v<version> if it does not exist yet
        run: |
          v="v$(node -p "require('./package.json').version")"
          git fetch --quiet origin "refs/tags/$v:refs/tags/$v" 2>/dev/null && { echo "$v already tagged"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$v" -m "Exaforce Design System ${v#v}"
          git push origin "$v"
          echo "tagged $v at $GITHUB_SHA"
