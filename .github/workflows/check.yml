name: check

# Every push and pull request: the token invariants, then a full build. Nothing
# to install — the scripts are plain Node. A failure here is what stops a bad
# token from reaching every site that links /v1/.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Invariants
        run: npm run check
      - name: Build
        run: npm run build
      - name: Report
        run: |
          echo "## Build" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node -e "const m=require('./dist/manifest.json');console.log('version',m.version);console.log('channels',Object.keys(m.channels).join(', '));console.log('fonts',Object.keys(m.fonts).length)" >> "$GITHUB_STEP_SUMMARY"
          du -sh dist >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
